<!doctype html>
<html lang="en">

<head>
  <!-- Critical CSS inlined — only the styles needed before any JS parses -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f9fafb;
      color: #111827;
    }

    #root {
      min-height: 100vh;
      background-color: #f9fafb;
    }
  </style>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Title, description, keywords, canonical, OG/Twitter are injected per-page by SEOHead (react-helmet-async via vite-react-ssg). -->

  <!-- Technical SEO: Geo + Language targeting -->
  <meta name="geo.region" content="IN" />
  <meta name="geo.country" content="India" />
  <meta name="language" content="English" />
  <meta name="content-language" content="en-IN" />
  <meta name="author" content="Study Volte" />
  <meta name="publisher" content="Study Volte" />
  <meta name="category" content="Education" />
  <meta name="classification" content="Education, Academic Resources" />
  <meta name="revisit-after" content="3 days" />
  <meta name="referrer" content="origin-when-cross-origin" />
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-optimized.png?v=8" fetchpriority="low" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=7" />

  <!-- Google Site Verification -->
  <meta name="google-site-verification" content="G7zGXUFFSLeVjGqAboVqJmHPxLXftlqkAA7eOOxLEVM" />

  <!-- Google AdSense site verification -->
  <meta name="google-adsense-account" content="ca-pub-7371660234749132" />

  <!-- Google AdSense loader -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7371660234749132"
    crossorigin="anonymous"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-17991393501"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'AW-17991393501');
  </script>

  <!-- Mobile Web App -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Fonts: Inter — non-blocking load so fonts never delay first paint -->
  <!-- Preconnect only for the 2 origins needed immediately (font files). -->
  <!-- Firebase origins are covered by dns-prefetch below (lighter-weight). -->
  <!-- Preload LCP image — tells browser to fetch logo before layout completes -->
  <!-- Using the optimized WebP image (12KB instead of 108KB) -->
  <link rel="preload" as="image" href="/logo-optimized.webp?v=8" fetchpriority="high">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Load Inter font asynchronously — never blocks critical rendering path -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
  </noscript>

  <!-- DNS/TCP hints for Firebase services (dns-prefetch = no TLS, lighter weight) -->
  <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com">
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <link rel="dns-prefetch" href="https://res.cloudinary.com">

  <!-- Open Graph image (for social sharing previews) -->
  <meta property="og:image" content="https://study-volte.site/logo-optimized.webp" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Study Volte - Academic Resource Sharing Platform" />

  <!-- Canonical is injected per-page by SEOHead. -->

  <!-- Organization Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Study Volte",
      "url": "https://study-volte.site",
      "logo": "https://study-volte.site/logo-optimized.webp",
      "description": "Platform for accessing and sharing academic question papers and study materials",
      "sameAs": [
        "https://www.facebook.com/profile.php?id=61586033282836",
        "https://x.com/@studybult",
        "https://www.instagram.com/studybult/",
        "https://linkedin.com/company/studyvolte",
        "https://www.youtube.com/@StudyVolte"
      ]
    }
    </script>

  <!-- Website Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Study Volte",
      "url": "https://study-volte.site",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://study-volte.site/browse?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  <!-- Breadcrumb Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BreadcrumbList",
      "itemListElement": [{
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://study-volte.site/"
      }]
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
